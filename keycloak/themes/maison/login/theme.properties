# Thème de connexion aux couleurs du site.
#
# Il hérite du thème keycloak.v2 et n'en remplace que la feuille de style :
# tous les écrans (connexion, erreur, mot de passe oublié…) et tout le
# comportement de Keycloak viennent du parent. Aucun gabarit n'est copié, pour
# que le thème survive aux montées de version de Keycloak.
parent=keycloak.v2
import=common/keycloak

# La feuille du parent d'abord, la nôtre ensuite, qui la surcharge. Keycloak
# cherche une ressource dans le thème, puis dans ses parents : css/styles.css
# est celle de keycloak.v2.
styles=css/styles.css css/maison.css

# Le mode sombre de PatternFly est désactivé : maison.css applique celui du
# site, sur la même préférence système, avec la même palette.
darkMode=false
