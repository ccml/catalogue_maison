# Infrastructure de développement local.
# Aucune de ces valeurs n'est utilisable en production : mots de passe en
# clair, Keycloak en mode start-dev, pas de TLS.
name: cataloguemaison

services:
  postgres:
    image: postgres:17
    container_name: maison-postgres
    environment:
      POSTGRES_USER: maison
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: catalogue
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maison -d catalogue"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: maison-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      # Le relais HTTPS du frontend (tools/dev.sh front-lan) transmet
      # l'origine vue par le téléphone dans les en-têtes X-Forwarded-*.
      # Keycloak en tire ses URL, et donc l'issuer des jetons émis par ce
      # chemin. Développement uniquement : en production, ces en-têtes ne
      # sont acceptés que d'un reverse proxy de confiance.
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "8080:8080"
    volumes:
      # L'export du realm est versionné dans /keycloak : toute modification
      # de configuration doit passer par ce fichier, pas par la console.
      - ../keycloak:/opt/keycloak/data/import:ro
      # Thème de connexion aux couleurs du site, versionné lui aussi. En
      # start-dev, Keycloak ne met pas les thèmes en cache : une feuille de
      # style modifiée se voit au rechargement de la page.
      - ../keycloak/themes:/opt/keycloak/themes:ro

volumes:
  postgres-data:
