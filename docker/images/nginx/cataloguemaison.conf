# nginx du conteneur frontend : seule porte d'entrée de CatalogueMaison.
#
# Le reverse proxy du serveur termine le TLS et relaie ici en HTTP, sur
# un réseau Docker partagé. Tout est servi sous une seule origine — c'est ce que le
# frontend attend d'une version de production (relayedSettings) :
#
#   /               application Angular
#   /api/           Catalogue.Api      (préfixe retiré)
#   /tenants-api/   Tenants.Api        (préfixe retiré)
#   /realms/, /resources/   Keycloak, realm « maison » seulement
#
# Ne sont PAS exposés : Metadata.Api (appelée par Catalogue.Api seule), la
# console et l'API d'administration de Keycloak (/admin), le realm master.

# Résolution des conteneurs à la requête, par le DNS de Docker : nginx
# démarre même si un service n'est pas encore là, et suit un conteneur
# recréé avec une autre adresse.
resolver 127.0.0.11 valid=10s ipv6=off;

# Le schéma vu par le navigateur, tel que le reverse proxy l'annonce.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # La caméra sert au scan des codes-barres, sur cette origine seulement.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    proxy_http_version 1.1;
    # $http_host et non $host : le port, s'il y en a un, fait partie de
    # l'origine. Keycloak en tire les URL qu'il annonce au navigateur.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $http_host;
    # Les cookies et en-têtes de Keycloak dépassent les tampons par défaut.
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # « ^~ » : ces préfixes l'emportent sur la règle de cache par extension,
    # plus bas. Sans lui, /resources/…/x.css serait cherché ici, en local.
    location ^~ /api/ {
        set $catalogue_api http://cataloguemaison-catalogue-api:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $catalogue_api;
    }

    location ^~ /tenants-api/ {
        set $tenants_api http://cataloguemaison-tenants-api:8080;
        rewrite ^/tenants-api/(.*)$ /$1 break;
        proxy_pass $tenants_api;
    }

    # Le realm master (administration de Keycloak) n'a rien à faire ici.
    location ^~ /realms/master {
        return 404;
    }

    location ^~ /realms/ {
        set $keycloak http://cataloguemaison-keycloak:8080;
        proxy_pass $keycloak;
    }

    location ^~ /resources/ {
        set $keycloak http://cataloguemaison-keycloak:8080;
        proxy_pass $keycloak;
    }

    # Fichiers à nom haché par la construction Angular (main-XXXXXXXX.js,
    # chunk-…, styles-…, media/) : immuables, leur nom change avec eux.
    # Entre guillemets : sans eux, nginx lit « { » comme l'ouverture du bloc.
    location ~ "^/(?:media/.+|[^/]+-[A-Za-z0-9_-]{8}\.(?:js|css))$" {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Fichiers statiques à nom fixe (icônes, manifeste, wasm de zxing) :
    # revalidés à chaque usage, sinon une nouvelle version n'atteindrait
    # jamais un navigateur qui les a déjà — c'est arrivé à la favicon.
    # Le mime.types de nginx ignore .webmanifest (servi sinon en octet-stream).
    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location ~* \.(?:png|svg|ico|wasm|woff2?)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Application monopage : toute autre route est servie par index.html,
    # jamais mis en cache pour qu'une nouvelle version soit prise aussitôt.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }
}
