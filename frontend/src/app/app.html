<header class="masthead">
  <div class="masthead-inner">
    <a class="wordmark" routerLink="/">Catalogue maison</a>

    @if (auth.hasHousehold()) {
      <nav>
        <a routerLink="/catalogue" routerLinkActive="current" [routerLinkActiveOptions]="{ exact: true }">
          Tout le catalogue
        </a>
        @if (auth.mayWrite()) {
          <a routerLink="/catalogue/ajouter" routerLinkActive="current">Ajouter</a>
        }
        @if (auth.mayAdministerHousehold()) {
          <a routerLink="/menage" routerLinkActive="current">Membres</a>
        }
      </nav>
    } @else if (auth.mayAdministerPlatform()) {
      <nav>
        <a routerLink="/menages" routerLinkActive="current">Ménages</a>
      </nav>
    }

    @if (auth.isAuthenticated()) {
      <div class="who">
        <span>{{ auth.displayName() }}</span>
        <button type="button" (click)="auth.signOut()">Se déconnecter</button>
      </div>
    }
  </div>
</header>

<main>
  <router-outlet />
</main>
